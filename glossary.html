<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Python words in English and Spanish, each with a drawing, a short meaning and a tiny example." />
    <meta name="theme-color" content="#fff8ec" />
    <title>Word list — PyBot</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script src="extras.js" defer></script>
  </head>
  <body class="glossary-page" data-page="glossary">
    <a class="skip-link" href="#main-content" data-i18n="a11y.skip">Skip to content</a>

    <header class="site-header lesson-site-header">
      <a class="brand" href="index.html" aria-label="PyBot, home" data-i18n-aria-label="a11y.home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>PyBot</span>
      </a>
      <div class="lesson-header-tools">
        <a class="meet-home-link" href="index.html" data-i18n="course.home">Home</a>
        <div
          class="language-switch"
          role="group"
          aria-label="Choose language"
          data-i18n-aria-label="a11y.language"
        >
          <button class="language-button is-active" type="button" data-language="en" aria-pressed="true">EN</button>
          <button class="language-button" type="button" data-language="es" aria-pressed="false">ES</button>
        </div>
      </div>
    </header>

    <main class="extras-main" id="main-content">
      <header class="meet-intro faq-intro">
        <p class="eyebrow eyebrow-blue" data-i18n="glossary.eyebrow"></p>
        <h1 data-i18n="glossary.title"></h1>
        <p data-i18n="glossary.intro"></p>
      </header>

      <label class="visually-hidden" for="glossary-search" data-i18n="glossary.search">Find a word</label>
      <input class="glossary-search" id="glossary-search" type="search" autocomplete="off" data-glossary-search data-i18n-placeholder="glossary.search" />
      <ul class="glossary-list" data-glossary-list></ul>
      <p class="diploma-missing" data-glossary-empty data-i18n="glossary.empty" hidden></p>
    </main>
  </body>
</html>
