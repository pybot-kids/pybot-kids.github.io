<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your PyBot stickers, zone diplomas and learning days." />
    <meta name="theme-color" content="#fff8ec" />
    <title>My album — PyBot</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script src="extras.js" defer></script>
  </head>
  <body class="album-page" data-page="album">
    <a class="skip-link" href="#main-content" data-i18n="a11y.skip">Skip to content</a>

    <header class="site-header lesson-site-header">
      <a class="brand" href="index.html" aria-label="PyBot, home" data-i18n-aria-label="a11y.home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>PyBot</span>
      </a>
      <div class="lesson-header-tools">
        <a class="meet-home-link" href="index.html" data-i18n="course.home">Home</a>
        <div
          class="language-switch"
          role="group"
          aria-label="Choose language"
          data-i18n-aria-label="a11y.language"
        >
          <button class="language-button is-active" type="button" data-language="en" aria-pressed="true">EN</button>
          <button class="language-button" type="button" data-language="es" aria-pressed="false">ES</button>
        </div>
      </div>
    </header>

    <main class="extras-main" id="main-content">
      <header class="meet-intro faq-intro">
        <p class="eyebrow eyebrow-blue" data-i18n="album.eyebrow"></p>
        <h1 data-i18n="album.title"></h1>
        <p data-i18n="album.intro"></p>
      </header>

      <section class="album-streak" aria-live="polite">
        <span class="album-streak-icon" aria-hidden="true">🔥</span>
        <p><span data-album-streak></span><small data-album-streak-note></small></p>
      </section>

      <h2><span data-i18n="album.stickers">Stickers</span> · <span data-sticker-count></span></h2>
      <ul class="sticker-grid" data-sticker-grid></ul>

      <p class="extras-actions">
        <a href="glossary.html" data-i18n="album.more">Want more? Look up a word in the word list.</a>
      </p>
    </main>
  </body>
</html>
