<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A printable PyBot diploma for a finished zone." />
    <meta name="theme-color" content="#fff8ec" />
    <title>Diploma — PyBot</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script src="extras.js" defer></script>
  </head>
  <body class="diploma-page" data-page="diploma">
    <a class="skip-link" href="#main-content" data-i18n="a11y.skip">Skip to content</a>

    <header class="site-header lesson-site-header">
      <a class="brand" href="index.html" aria-label="PyBot, home" data-i18n-aria-label="a11y.home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>PyBot</span>
      </a>
      <div class="lesson-header-tools">
        <a class="meet-home-link" href="index.html" data-i18n="course.home">Home</a>
        <div
          class="language-switch"
          role="group"
          aria-label="Choose language"
          data-i18n-aria-label="a11y.language"
        >
          <button class="language-button is-active" type="button" data-language="en" aria-pressed="true">EN</button>
          <button class="language-button" type="button" data-language="es" aria-pressed="false">ES</button>
        </div>
      </div>
    </header>

    <main class="extras-main" id="main-content">
      <header class="meet-intro faq-intro">
        <p class="eyebrow eyebrow-blue" data-i18n="diploma.eyebrow"></p>
        <h1 data-i18n="diploma.title"></h1>
        <p data-i18n="diploma.intro"></p>
      </header>

      <div class="diploma-tools" data-diploma-tools hidden>
        <label class="diploma-name-field">
          <span data-i18n="diploma.nameLabel">Name on the diploma</span>
          <input type="text" maxlength="24" autocomplete="off" data-diploma-input data-i18n-placeholder="diploma.namePlaceholder" />
        </label>
      </div>

      <article class="diploma" data-diploma hidden>
        <span class="diploma-brand"><span class="brand-mark" aria-hidden="true"><span></span></span> PyBot</span>
        <p class="diploma-kicker" data-i18n="diploma.kicker">DIPLOMA</p>
        <p class="diploma-zone diploma-heading" data-i18n="diploma.heading">Great coder!</p>
        <p class="diploma-line" data-i18n="diploma.line">This diploma says that</p>
        <p class="diploma-name" data-diploma-name></p>
        <p class="diploma-line" data-i18n="diploma.finished">finished the PyBot zone</p>
        <p class="diploma-zone"><span class="diploma-sticker" aria-hidden="true" data-diploma-sticker></span> <span data-diploma-zone></span></p>
        <div class="diploma-footer">
          <p><span data-i18n="diploma.date">Date</span><b data-diploma-date></b></p>
          <p><span data-i18n="diploma.signed">Signed</span><b>PyBot 🤖</b></p>
          <p><span>pybot-kids.github.io</span></p>
        </div>
      </article>

      <p class="extras-actions" data-diploma-tools-actions>
        <button class="is-primary" type="button" data-print="diploma" data-i18n="diploma.print">Print or save as PDF</button>
        <a href="album.html" data-i18n="diploma.back">Back to my album</a>
      </p>

      <section class="diploma-missing" data-diploma-missing hidden>
        <h2 data-i18n="diploma.missingTitle">This diploma is still waiting</h2>
        <p></p>
        <p class="extras-actions"><a class="is-primary" href="course.html" data-i18n="diploma.goMap">Go to the learning path</a></p>
      </section>
    </main>
  </body>
</html>
